name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Tim thu muc chua build.gradle.kts
        id: findroot
        run: |
          FILE=$(find . -name "build.gradle.kts" -not -path "*/.git/*" | head -1)
          if [ -z "$FILE" ]; then
            echo "::error::Khong tim thay build.gradle.kts o dau trong repo ca. Gui ảnh cau truc repo cho tro ly."
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "root=$DIR" >> "$GITHUB_OUTPUT"
          echo "Tim thay build.gradle.kts tai: $DIR"

      - name: Tim phien ban Paper API cho 26.3
        id: paperver
        run: |
          UA="coit-plugin-build/1.0 (github actions)"
          META=$(curl -s -H "User-Agent: $UA" "https://fill.papermc.io/v3/projects/paper")
          echo "$META"
          HAS=$(echo "$META" | grep -o '"26\.3[^"]*"' | head -1 | tr -d '"')
          if [ -z "$HAS" ]; then
            echo "::error::Chua tim thay phien ban Paper cho 26.3 trong danh sach tren (fill.papermc.io/v3/projects/paper). Gui noi dung tren cho tro ly de chinh."
            exit 1
          fi
          BUILDS=$(curl -s -H "User-Agent: $UA" "https://fill.papermc.io/v3/projects/paper/versions/$HAS/builds")
          LATEST=$(echo "$BUILDS" | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*')
          echo "version=$HAS" >> "$GITHUB_OUTPUT"
          echo "build=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Dung Paper $HAS build $LATEST"

      - name: Ghi phien ban vao build.gradle.kts
        run: |
          ROOT="${{ steps.findroot.outputs.root }}"
          sed -i "s/__PAPER_API_VERSION__/${{ steps.paperver.outputs.version }}-R0.1-SNAPSHOT/" "$ROOT/build.gradle.kts"
          cat "$ROOT/build.gradle.kts"

      - name: Build
        run: |
          ROOT="${{ steps.findroot.outputs.root }}"
          cd "$ROOT"
          gradle_version="9.1.0"
          curl -sL "https://services.gradle.org/distributions/gradle-$gradle_version-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-$gradle_version/bin/gradle build --no-daemon --stacktrace > /tmp/build.log 2>&1 || {
            grep -E "\.java:[0-9]+: error" /tmp/build.log | sed 's/^/::error::/'
            grep -A4 "What went wrong" /tmp/build.log | head -12 | sed 's/^/::error::/'
            tail -n 40 /tmp/build.log
            exit 1
          }
          tail -n 40 /tmp/build.log

      - name: Gom file jar
        run: |
          ROOT="${{ steps.findroot.outputs.root }}"
          mkdir -p dist
          JAR=$(ls "$ROOT"/build/libs/*.jar | head -1)
          cp "$JAR" dist/coit-26.3.jar
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: coit-26.3
          path: dist/*.jar

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: coit-build
          name: Coit plugin 26.3 (ban moi nhat)
          body: "File jar tu dong build cho Paper 26.3."
          files: dist/*.jar
