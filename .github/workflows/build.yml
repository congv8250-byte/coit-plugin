name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Tim thu muc chua build.gradle.kts
        id: findroot
        run: |
          FILE=$(find . -name "build.gradle.kts" -not -path "*/.git/*" | head -1)
          if [ -z "$FILE" ]; then
            echo "::error::Khong tim thay build.gradle.kts o dau trong repo ca. Gui anh cau truc repo cho tro ly."
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "root=$DIR" >> "$GITHUB_OUTPUT"
          echo "Tim thay build.gradle.kts tai: $DIR"

      - name: Build
        run: |
          ROOT="${{ steps.findroot.outputs.root }}"
          cd "$ROOT"
          gradle_version="9.1.0"
          curl -sL "https://services.gradle.org/distributions/gradle-$gradle_version-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-$gradle_version/bin/gradle build --no-daemon --stacktrace > /tmp/build.log 2>&1 || {
            grep -E "\.java:[0-9]+: error" /tmp/build.log | sed 's/^/::error::/'
            grep -A6 "What went wrong" /tmp/build.log | head -15 | sed 's/^/::error::/'
            tail -n 50 /tmp/build.log
            exit 1
          }
          tail -n 40 /tmp/build.log

      - name: Gom file jar
        run: |
          ROOT="${{ steps.findroot.outputs.root }}"
          mkdir -p dist
          JAR=$(ls "$ROOT"/build/libs/*.jar | head -1)
          cp "$JAR" dist/coit-26.3.jar
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: coit-26.3
          path: dist/*.jar

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: coit-build
          name: Coit plugin 26.3 (ban moi nhat)
          body: "File jar tu dong build cho Paper 26.3."
          files: dist/*.jar
